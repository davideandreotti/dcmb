campaign:
  name: docker_stats_smoke
  output_root: experiments
  runs: 1
  duration_s: 5
  warmup_s: 1
  cooldown_s: 1
  readiness_timeout_s: 30
  cpu_interval_s: 0.2
  trace_buffer_events: 100000
  trace_drop_on_full: true

hosts:
  client: {host: localhost, ip: 127.0.0.1}
  middlebox: {host: localhost, ip: 127.0.0.1}
  server: {host: localhost, ip: 10.79.1.175}

paths:
  middlebox_dir: /home/bonsai/dcmb/DC/Middlebox

server:
  target_url: https://10.79.1.175:8000
  cert_url: http://10.79.1.175:5000
  request_path: /function/init
  certserver_command: ["./certserver"]
  appserver_command: ["./appserver"]

client:
  binary: ./client
  method: POST
  servername: server
  data: {operation: init}
  headers:
    - "Authorization: Bearer token"
    - "Content-Type: application/json"
    - "X-Testing: 1"
  max_in_flight: 64

client_matrix:
  modes: [fresh]
  clients: [1]
  rates: [10]

deployments:
  - name: docker_stats_smoke
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: false
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000
