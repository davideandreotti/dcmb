campaign:
  name: startup_problematic_smoke
  output_root: experiments
  startup_only: true
  runs: 1
  duration_s: 0
  warmup_s: 0
  cooldown_s: 1
  readiness_timeout_s: 90
  trace_buffer_events: 100000
  trace_drop_on_full: true

hosts:
  client: {host: localhost, ip: 127.0.0.1}
  middlebox: {host: localhost, ip: 127.0.0.1}
  server: {host: localhost, ip: 10.79.1.175}

paths:
  middlebox_dir: /home/bonsai/dcmb/DC/Middlebox

server:
  target_url: https://10.79.1.175:8000
  cert_url: http://10.79.1.175:5000
  request_path: /function/init

deployments:
  - name: startup_gramine_sgx
    kind: gramine_sgx
    command: ["gramine-sgx", "middlebox", "-log_level", "error", "-reuse_dc=true"]
    env: {MBX_EMIT_QUOTE: "0"}

  - name: startup_container_gramine_sgx
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    worker_image: dcmiddlebox-worker:sgx-standard-startup
    worker_reuse_dc: true
    worker_sgx_enabled: true
    worker_emit_quote: "0"
    min_ready: 1
    scale_up_by: 1
    worker_trace_enabled: false
    docker_ready_timeout_ms: 60000
