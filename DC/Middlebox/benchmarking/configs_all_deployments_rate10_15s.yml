campaign:
  name: all_deployments_rate10_15s
  output_root: experiments
  # Final paper: use >=5 runs/point, 10 for noisy p99 points; startup-only uses 20-30.
  runs: 1
  duration_s: 15
  warmup_s: 1
  cooldown_s: 2
  readiness_timeout_s: 30
  cpu_interval_s: 0.2
  trace_buffer_events: 100000
  trace_drop_on_full: true

hosts:
  client:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  middlebox:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  server:
    host: localhost
    ip: 10.79.1.175
    work_dir: /home/bonsai/dcmb

paths:
  middlebox_dir: /home/bonsai/dcmb/DC/Middlebox

server:
  target_url: https://10.79.1.175:8000
  cert_url: http://10.79.1.175:5000
  request_path: /function/init
  certserver_command: ["./certserver"]
  appserver_command: ["./appserver"]

client:
  binary: ./client
  method: POST
  servername: server
  data:
    operation: init
  headers:
    - "Authorization: Bearer token"
    - "Content-Type: application/json"
    - "X-Testing: 1"
  max_in_flight: 1024

client_matrix:
  modes: [fresh, persistent]
  clients: [1]
  rates: [10]

deployments:
  - name: direct
    kind: direct

  - name: baremetal_full_reuse
    kind: baremetal
    command: ["./middlebox", "-log_level", "error", "-minimal_logs=true", "-reuse_dc=true"]

  - name: baremetal_full_noreuse
    kind: baremetal
    command: ["./middlebox", "-log_level", "error", "-minimal_logs=true", "-reuse_dc=false"]

  - name: baremetal_empty_reuse
    kind: baremetal
    command: ["./middlebox_emptyhandler", "-log_level", "error", "-minimal_logs=true", "-reuse_dc=true"]

  - name: baremetal_empty_noreuse
    kind: baremetal
    command: ["./middlebox_emptyhandler", "-log_level", "error", "-minimal_logs=true", "-reuse_dc=false"]

  - name: sgx_full_reuse
    kind: gramine_sgx
    command: ["gramine-sgx", "middlebox", "-log_level", "error", "-minimal_logs=true", "-reuse_dc=true"]
    env:
      MBX_EMIT_QUOTE: "1"

  - name: sgx_full_noreuse
    kind: gramine_sgx
    command: ["gramine-sgx", "middlebox", "-log_level", "error", "-minimal_logs=true", "-reuse_dc=false"]
    env:
      MBX_EMIT_QUOTE: "1"

  - name: sgx_empty_reuse
    kind: gramine_sgx
    command: ["gramine-sgx", "middlebox_emptyhandler", "-log_level", "error", "-minimal_logs=true", "-reuse_dc=true"]
    env:
      MBX_EMIT_QUOTE: "1"

  - name: sgx_empty_noreuse
    kind: gramine_sgx
    command: ["gramine-sgx", "middlebox_emptyhandler", "-log_level", "error", "-minimal_logs=true", "-reuse_dc=false"]
    env:
      MBX_EMIT_QUOTE: "1"

  - name: docker_full_noreuse
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: false
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000

  - name: docker_empty_noreuse
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    worker_image: dcmiddlebox-worker:emptyhandler
    worker_reuse_dc: false
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000

  - name: docker_sgxgo_full_noreuse
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: false
    worker_sgx_enabled: true
    worker_emit_quote: "1"
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
