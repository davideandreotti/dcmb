campaign:
  name: huge_comparison_full_docker_rootful_60s
  output_root: experiments
  # Final paper: use >=5 runs/point, 10 for noisy p99 points; startup-only uses 20-30.
  runs: 1
  duration_s: 60
  warmup_s: 1
  cooldown_s: 2
  readiness_timeout_s: 30
  cpu_interval_s: 0.2
  trace_buffer_events: 100000
  trace_drop_on_full: true

hosts:
  client:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  middlebox:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  server:
    host: localhost
    ip: 10.79.1.175
    work_dir: /home/bonsai/dcmb

paths:
  middlebox_dir: /home/bonsai/dcmb/DC/Middlebox

server:
  target_url: https://10.79.1.175:8000
  cert_url: http://10.79.1.175:5000
  request_path: /function/init
  certserver_command: ["./certserver"]
  appserver_command: ["./appserver"]

client:
  binary: ./client
  method: POST
  servername: server
  data:
    operation: init
  headers:
    - "Authorization: Bearer token"
    - "Content-Type: application/json"
    - "X-Testing: 1"
  max_in_flight: 1024

client_matrix:
  modes: [fresh, persistent]
  clients: [1]
  rates: [1, 5, 10, 50, 100, 500, 1000]

deployments:
  - name: docker_full_noreuse
    kind: docker_gateway
    runtime: podman
    network: dcmb-middlebox-net
    socket_host: /run/podman/podman.sock
    socket_container: /var/run/docker.sock
    worker_image: dcmiddlebox-worker:baseline
    worker_certs_host_path: /home/bonsai/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_reuse_dc: false
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000

  - name: docker_empty_noreuse
    kind: docker_gateway
    runtime: podman
    network: dcmb-middlebox-net
    socket_host: /run/podman/podman.sock
    socket_container: /var/run/docker.sock
    worker_image: dcmiddlebox-worker:emptyhandler
    worker_certs_host_path: /home/bonsai/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_reuse_dc: false
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000
