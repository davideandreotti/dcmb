campaign:
  name: docker_sgxgo_smoke
  output_root: experiments
  # Final paper: use >=5 runs/point, 10 for noisy p99 points; startup-only uses 20-30.
  runs: 1
  duration_s: 5
  warmup_s: 1
  cooldown_s: 2
  readiness_timeout_s: 30
  cpu_interval_s: 0.2
  trace_buffer_events: 100000
  trace_drop_on_full: true

hosts:
  client:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  middlebox:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  server:
    host: localhost
    ip: 10.79.1.175
    work_dir: /home/bonsai/dcmb

paths:
  middlebox_dir: /home/bonsai/dcmb/DC/Middlebox

server:
  target_url: https://10.79.1.175:8000
  cert_url: http://10.79.1.175:5000
  request_path: /function/init
  certserver_command: ["./certserver"]
  appserver_command: ["./appserver"]

client:
  binary: ./client
  method: POST
  servername: server
  data:
    operation: init
  headers:
    - "Authorization: Bearer token"
    - "Content-Type: application/json"
    - "X-Testing: 1"
  max_in_flight: 64

client_matrix:
  modes: [persistent]
  clients: [1]
  rates: [0]

deployments:
  - name: docker_sgxgo_smoke
    kind: docker_gateway
    runtime: docker
    network: dcmb-middlebox-net
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    worker_image: dcmiddlebox-worker:sgxgo
    worker_certs_host_path: /home/bonsai/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    worker_reuse_dc: true
    worker_sgx_enabled: true
    worker_emit_quote: "1"
    min_ready: 1
    scale_up_by: 1
    container_stats_scope: all
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000
