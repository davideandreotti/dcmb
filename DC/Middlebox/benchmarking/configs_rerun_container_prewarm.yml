campaign:
  name: rerun_container_prewarm
  output_root: experiments
  runs: 1
  duration_s: 15
  warmup_s: 1
  cooldown_s: 3
  readiness_timeout_s: 60
  cpu_interval_s: 0.2
  trace_buffer_events: 100000
  trace_drop_on_full: true

hosts:
  client: {host: localhost, ip: 127.0.0.1, work_dir: /home/bonsai/dcmb/DC/Middlebox}
  middlebox: {host: localhost, ip: 127.0.0.1, work_dir: /home/bonsai/dcmb/DC/Middlebox}
  server: {host: localhost, ip: 10.79.1.175, work_dir: /home/bonsai/dcmb}

paths:
  middlebox_dir: /home/bonsai/dcmb/DC/Middlebox
  server_app_script: /home/bonsai/dcmb/PerformanceMeasuring/certs_server.py

server:
  target_url: https://10.79.1.175:8000
  cert_url: http://10.79.1.175:5000
  request_path: /function/init
  certserver_command: ["./certserver"]
  appserver_command: ["python3", "-u", "/home/bonsai/dcmb/PerformanceMeasuring/certs_server.py"]

client:
  binary: ./client
  method: POST
  servername: server
  data: {operation: init}
  headers: ["Authorization: Bearer token", "Content-Type: application/json", "X-Testing: 1"]
  max_in_flight: 1024

client_matrix:
  modes: [persistent]
  clients: [50]
  rates: [1000, 5000]

deployments:
  - name: docker_full_reuse
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 180
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: true
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000

  - name: docker_sgxgo_full_reuse
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 180
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: true
    worker_sgx_enabled: true
    worker_emit_quote: "1"
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000

  - name: docker_full_resumption
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 180
    modes: [resumption]
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: false
    ticket_identity_key: dcmb-rerun-resumption
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000

  - name: docker_sgxgo_full_resumption
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 180
    modes: [resumption]
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: false
    worker_sgx_enabled: true
    worker_emit_quote: "1"
    ticket_identity_key: dcmb-rerun-resumption
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000
