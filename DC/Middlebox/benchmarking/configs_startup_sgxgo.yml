campaign:
  name: sgxgo_startup
  output_root: experiments
  startup_only: true
  # Use 5 while validating the setup; use 20-30 starts for final confidence intervals.
  runs: 5
  duration_s: 0
  cooldown_s: 10
  readiness_timeout_s: 90
  trace_buffer_events: 100000
  trace_drop_on_full: true

deployments:
  - name: startup_sgxgo
    kind: gramine_sgx
    command: ["gramine-sgx", "middlebox_sgxgo", "-log_level", "error"]
