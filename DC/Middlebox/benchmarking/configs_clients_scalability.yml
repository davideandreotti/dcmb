campaign:
  name: clients_scalability
  output_root: experiments
  # Final paper: use >=5 runs/point, 10 for noisy p99 points; startup-only uses 20-30.
  runs: 1
  duration_s: 30
  warmup_s: 1
  cooldown_s: 2
  readiness_timeout_s: 30
  cpu_interval_s: 0.2
  trace_buffer_events: 100000
  trace_drop_on_full: true

hosts:
  client:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  middlebox:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  server:
    host: localhost
    ip: 10.79.1.175
    work_dir: /home/bonsai/dcmb

paths:
  middlebox_dir: /home/bonsai/dcmb/DC/Middlebox
  server_app_script: /home/bonsai/dcmb/PerformanceMeasuring/certs_server.py

server:
  target_url: https://10.79.1.175:8000
  cert_url: http://10.79.1.175:5000
  request_path: /function/init
  certserver_command: ["./certserver"]
  appserver_command: ["python3", "-u", "/home/bonsai/dcmb/PerformanceMeasuring/certs_server.py"]

client:
  binary: ./client
  method: POST
  servername: server
  data:
    operation: init
  headers:
    - "Authorization: Bearer token"
    - "Content-Type: application/json"
    - "X-Testing: 1"
  max_in_flight: 1024

client_matrix:
  modes: [persistent]
  clients: [1, 5, 10, 50]
  rates_by_mode:
    persistent: [1, 10, 100, 1000, 5000]
    resumption: [1, 10, 100, 1000, 5000]

# NOTE: direct persistent TLS currently depends on the Python application
# server's connection behavior. Recheck it before the final paper campaign.
# NOTE: on the rootful Podman host, verify that the streaming stats collector
# reports source=podman_stats_stream in metadata.json; it falls back to
# podman_stats_no_stream if that Podman version cannot stream --all.

deployments:
  - name: direct
    kind: direct

  - name: baremetal_full_reuse
    kind: baremetal
    command: ["./middlebox", "-log_level", "error", "-minimal_logs=true", "-reuse_dc=true"]

  - name: sgx_full_reuse
    kind: gramine_sgx
    command: ["gramine-sgx", "middlebox", "-log_level", "error", "-minimal_logs=true", "-reuse_dc=true"]
    env:
      MBX_EMIT_QUOTE: "0"

  - name: docker_full_reuse
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    runtime: docker
    network: dcmb-middlebox-net
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    worker_image: dcmiddlebox-worker:baseline
    worker_certs_host_path: /home/bonsai/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_reuse_dc: true
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000

  - name: docker_sgxgo_full_reuse
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    runtime: docker
    network: dcmb-middlebox-net
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    worker_image: dcmiddlebox-worker:sgxgo
    worker_certs_host_path: /home/bonsai/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    worker_reuse_dc: true
    worker_sgx_enabled: true
    worker_emit_quote: "1"
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000

  - name: docker_full_resumption
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    modes: [resumption]
    runtime: docker
    network: dcmb-middlebox-net
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    worker_image: dcmiddlebox-worker:baseline
    worker_certs_host_path: /home/bonsai/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_reuse_dc: false
    ticket_identity_key: dcmb-scalability-resumption
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000

  - name: docker_sgxgo_full_resumption
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    modes: [resumption]
    runtime: docker
    network: dcmb-middlebox-net
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    worker_image: dcmiddlebox-worker:sgxgo
    worker_certs_host_path: /home/bonsai/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    worker_reuse_dc: false
    worker_sgx_enabled: true
    worker_emit_quote: "1"
    ticket_identity_key: dcmb-scalability-resumption
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000
