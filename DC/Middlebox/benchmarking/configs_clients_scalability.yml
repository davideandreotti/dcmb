campaign:
  name: clients_scalability
  output_root: experiments
  # Final paper: use >=5 runs/point, 10 for noisy p99 points; startup-only uses 20-30.
  runs: 5
  duration_s: 60
  warmup_s: 1
  cooldown_s: 10
  readiness_timeout_s: 30
  cpu_interval_s: 0.2
  trace_buffer_events: 100000
  trace_drop_on_full: true

hosts:
  client:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  middlebox:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  server:
    host: localhost
    ip: 10.79.1.175
    work_dir: /home/bonsai/dcmb

paths:
  middlebox_dir: /home/bonsai/dcmb/DC/Middlebox

server:
  target_url: https://10.79.1.175:8000
  cert_url: http://10.79.1.175:5000
  request_path: /function/init
  certserver_command: ["./certserver", "-log_level", "error"]
  appserver_command: ["./appserver", "-log_level", "error"]

client:
  binary: ./client
  pacing: timer
  method: POST
  servername: server
  data:
    operation: init
  headers:
    - "Authorization: Bearer token"
    - "Content-Type: application/json"
    - "X-Testing: 1"
  max_in_flight: 1024

client_matrix:
  modes: [persistent]
  # Compare saturated closed-loop capacity with the same fixed aggregate load
  # at every client count.
  points:
    - {clients: 1, rate: 0}
    - {clients: 1, rate: 10}
    - {clients: 5, rate: 0}
    - {clients: 5, rate: 10}
    - {clients: 10, rate: 0}
    - {clients: 10, rate: 10}
    - {clients: 20, rate: 0}
    - {clients: 20, rate: 10}
    - {clients: 30, rate: 0}
    - {clients: 30, rate: 10}
    - {clients: 40, rate: 0}
    - {clients: 40, rate: 10}
    - {clients: 50, rate: 0}
    - {clients: 50, rate: 10}

# NOTE: on the rootful Podman host, verify that the streaming stats collector
# reports source=podman_stats_stream in metadata.json; it falls back to
# podman_stats_no_stream if that Podman version cannot stream --all.

deployments:
  - name: baremetal_full_reuse
    kind: baremetal
    command: ["./middlebox", "-log_level", "error", "-reuse_dc=true"]

  - name: sgx_full_reuse
    kind: gramine_sgx
    command: ["gramine-sgx", "middlebox", "-log_level", "error", "-reuse_dc=true"]
    env:
      MBX_EMIT_QUOTE: "1"

  - name: docker_full_reuse
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: true
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false

  - name: docker_sgxgo_full_reuse
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: true
    worker_sgx_enabled: true
    worker_emit_quote: "1"
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
