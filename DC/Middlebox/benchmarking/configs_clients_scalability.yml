campaign:
  name: clients_scalability
  output_root: experiments
  runs: 1
  duration_s: 60
  warmup_s: 1
  cooldown_s: 2
  readiness_timeout_s: 30
  cpu_interval_s: 0.2
  trace_buffer_events: 100000
  trace_drop_on_full: true

hosts:
  client:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  middlebox:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  server:
    host: localhost
    ip: 10.79.1.175
    work_dir: /home/bonsai/dcmb

paths:
  middlebox_dir: /home/bonsai/dcmb/DC/Middlebox
  server_app_script: /home/bonsai/dcmb/PerformanceMeasuring/certs_server.py

server:
  target_url: https://10.79.1.175:8000
  cert_url: http://10.79.1.175:5000
  request_path: /function/init
  certserver_command: ["./certserver"]
  appserver_command: ["python3", "-u", "/home/bonsai/dcmb/PerformanceMeasuring/certs_server.py"]

client:
  binary: ./client
  method: POST
  servername: server
  data:
    operation: init
  headers:
    - "Authorization: Bearer token"
    - "Content-Type: application/json"
    - "X-Testing: 1"
  max_in_flight: 1024

client_matrix:
  modes: [persistent]
  clients: [1, 2, 4, 8, 16, 32, 64]
  rates: [0, 50, 100, 500, 1000]

deployments:
  - name: direct
    kind: direct

  - name: baremetal_full_reuse
    kind: baremetal
    command: ["./middlebox", "-log_level", "debug", "-minimal_logs=false", "-reuse_dc=true"]

  - name: sgx_full_reuse
    kind: gramine_sgx
    command: ["gramine-sgx", "middlebox", "-log_level", "debug", "-minimal_logs=false", "-reuse_dc=true"]
    env:
      MBX_EMIT_QUOTE: "0"

  - name: docker_full_reuse
    kind: docker_gateway
    runtime: podman
    network: dcmb-middlebox-net
    socket_host: /run/podman/podman.sock
    socket_container: /var/run/docker.sock
    worker_image: dcmiddlebox-worker:baseline
    worker_certs_host_path: /home/bonsai/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_reuse_dc: true
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000

  - name: docker_sgxgo_full_reuse
    kind: docker_gateway
    runtime: podman
    network: dcmb-middlebox-net
    socket_host: /run/podman/podman.sock
    socket_container: /var/run/docker.sock
    worker_image: dcmiddlebox-worker:sgxgo
    worker_certs_host_path: /home/bonsai/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    worker_reuse_dc: true
    worker_sgx_enabled: true
    worker_emit_quote: "0"
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
    docker_ready_timeout_ms: 15000
