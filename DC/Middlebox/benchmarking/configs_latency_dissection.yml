# Canonical methodology; adapt /path/to/dcmb and SERVER_IP in an ignored local copy.
# Docker is the reference runtime; see docs/native-experiment-handover.md for host setup.
campaign:
  name: latency_dissection
  output_root: experiments
  # Use 1 for a smoke test and at least 5 for the final confidence intervals.
  runs: 5
  duration_s: 60
  warmup_s: 1
  cooldown_s: 2
  readiness_timeout_s: 30
  cpu_interval_s: 0.2
  trace_buffer_events: 100000
  trace_drop_on_full: false

hosts:
  client: {host: localhost, ip: 127.0.0.1, work_dir: /path/to/dcmb/DC/Middlebox}
  middlebox: {host: localhost, ip: 127.0.0.1, work_dir: /path/to/dcmb/DC/Middlebox}
  server: {host: localhost, ip: SERVER_IP, work_dir: /path/to/dcmb/DC/Middlebox}

paths:
  middlebox_dir: /path/to/dcmb/DC/Middlebox

server:
  target_url: https://SERVER_IP:8000
  cert_url: http://SERVER_IP:5000
  request_path: /function/init
  certserver_command: ["./certserver", "-log_level", "error", "-cert-path", "/path/to/dcmb/certs_external/server/cert.pem", "-key-path", "/path/to/dcmb/certs_external/server/key.pem"]
  appserver_command: ["./appserver", "-log_level", "error", "-cert-path", "/path/to/dcmb/certs_external/server/cert.pem", "-key-path", "/path/to/dcmb/certs_external/server/key.pem"]

client:
  binary: ./client
  method: POST
  servername: server
  data: {operation: init}
  headers:
    - "Authorization: Bearer token"
    - "Content-Type: application/json"
    - "X-Testing: 1"
  max_in_flight: 16

client_matrix:
  modes: [fresh, persistent, resumption]
  clients: [1]
  rates_by_mode:
    fresh: [1]
    persistent: [10]
    resumption: [5]

deployments:
  - name: direct
    kind: direct
    modes: [fresh, persistent]

  - name: baremetal_full_noreuse
    kind: baremetal
    modes: [fresh]
    command: ["./middlebox", "-log_level", "error", "-reuse_dc=false", "-ca", "/path/to/dcmb/certs_external/ca.crt"]

  - name: baremetal_full_reuse
    kind: baremetal
    modes: [persistent]
    command: ["./middlebox", "-log_level", "error", "-reuse_dc=true", "-ca", "/path/to/dcmb/certs_external/ca.crt"]

  - name: sgx_full_noreuse
    kind: gramine_sgx
    modes: [fresh]
    command: ["gramine-sgx", "middlebox", "-log_level", "error", "-reuse_dc=false"]
    env: {MBX_EMIT_QUOTE: "0"}

  - name: sgx_full_reuse
    kind: gramine_sgx
    modes: [persistent]
    command: ["gramine-sgx", "middlebox", "-log_level", "error", "-reuse_dc=true"]
    env: {MBX_EMIT_QUOTE: "0"}

  - name: docker_full_noreuse
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    network: dcmb-middlebox-net
    worker_certs_host_path: /path/to/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    modes: [fresh]
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: false
    min_ready: 2
    scale_up_by: 1
    wait_for_full_pool: true
    pool_readiness_timeout_s: 120
    worker_trace_enabled: true
    docker_api_timeout_ms: 30000

  - name: docker_full_reuse
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    network: dcmb-middlebox-net
    worker_certs_host_path: /path/to/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    modes: [persistent]
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: true
    min_ready: 2
    scale_up_by: 1
    wait_for_full_pool: true
    pool_readiness_timeout_s: 120
    worker_trace_enabled: true
    docker_api_timeout_ms: 30000

  - name: docker_full_resumption
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    network: dcmb-middlebox-net
    worker_certs_host_path: /path/to/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    modes: [resumption]
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: false
    ticket_identity_key: dcmb-dissection-resumption
    delete_after_use: false
    min_ready: 2
    scale_up_by: 1
    wait_for_full_pool: true
    pool_readiness_timeout_s: 120
    worker_trace_enabled: true
    docker_api_timeout_ms: 30000

  - name: docker_sgxgo_full_noreuse
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    network: dcmb-middlebox-net
    worker_certs_host_path: /path/to/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    modes: [fresh]
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: false
    worker_sgx_enabled: true
    worker_emit_quote: "0"
    min_ready: 2
    scale_up_by: 1
    wait_for_full_pool: true
    pool_readiness_timeout_s: 120
    worker_trace_enabled: true
    docker_api_timeout_ms: 30000
    docker_ready_timeout_ms: 30000

  - name: docker_sgxgo_full_reuse
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    network: dcmb-middlebox-net
    worker_certs_host_path: /path/to/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    modes: [persistent]
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: true
    worker_sgx_enabled: true
    worker_emit_quote: "0"
    min_ready: 2
    scale_up_by: 1
    wait_for_full_pool: true
    pool_readiness_timeout_s: 120
    worker_trace_enabled: true
    docker_api_timeout_ms: 30000
    docker_ready_timeout_ms: 30000

  - name: docker_sgxgo_full_resumption
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    network: dcmb-middlebox-net
    worker_certs_host_path: /path/to/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    modes: [resumption]
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: false
    worker_sgx_enabled: true
    worker_emit_quote: "0"
    ticket_identity_key: dcmb-dissection-resumption
    delete_after_use: false
    min_ready: 2
    scale_up_by: 1
    wait_for_full_pool: true
    pool_readiness_timeout_s: 120
    worker_trace_enabled: true
    docker_api_timeout_ms: 30000
    docker_ready_timeout_ms: 30000
