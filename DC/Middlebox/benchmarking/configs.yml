# Canonical methodology; adapt /path/to/dcmb and SERVER_IP in an ignored local copy.
# Docker is the reference runtime; see docs/native-experiment-handover.md for host setup.
campaign:
  name: paper_single_client
  output_root: experiments
  # Final paper: use >=5 runs/point, 10 for noisy p99 points; startup-only uses 20-30.
  runs: 5
  duration_s: 60
  warmup_s: 1
  cooldown_s: 10
  readiness_timeout_s: 30
  cpu_interval_s: 0.2
  # Keep middlebox logger buffers without recording; retain other trace roles.
  # Shared commands and container worker_trace_enabled below select buffers.
  # Shared-SGX memory sampling is disabled in buffer-only mode.
  trace_roles: [client, gateway, certserver, server]
  trace_buffer_events: 100000
  trace_drop_on_full: true

hosts:
  client:
    host: localhost
    ip: 127.0.0.1
    work_dir: /path/to/dcmb/DC/Middlebox
  middlebox:
    host: localhost
    ip: 127.0.0.1
    work_dir: /path/to/dcmb/DC/Middlebox
  server:
    host: localhost
    ip: SERVER_IP
    work_dir: /path/to/dcmb/DC/Middlebox

paths:
  middlebox_dir: /path/to/dcmb/DC/Middlebox

server:
  target_url: https://SERVER_IP:8000
  cert_url: http://SERVER_IP:5000
  request_path: /function/init
  certserver_command: ["./certserver", "-log_level", "error", "-cert-path", "/path/to/dcmb/certs_external/server/cert.pem", "-key-path", "/path/to/dcmb/certs_external/server/key.pem"]
  appserver_command: ["./appserver", "-log_level", "error", "-cert-path", "/path/to/dcmb/certs_external/server/cert.pem", "-key-path", "/path/to/dcmb/certs_external/server/key.pem"]

client:
  binary: ./client
  pacing: spin
  method: POST
  servername: server
  data:
    operation: init
  headers:
    - "Authorization: Bearer token"
    - "Content-Type: application/json"
    - "X-Testing: 1"
  max_in_flight: 1024

client_matrix:
  modes: [fresh, persistent, resumption]
  clients: [1]
  rates_by_mode:
    # Relaxed points are sufficient for the latency distributions. Handshake
    # capacity is explored separately by configs_handshake_capacity.yml.
    fresh: [1]
    resumption: [10]
    # Dense around the low-load baseline, the expected one-client knees, and
    # the previously sparse interval between 1000 and 5000 requests/s.
    persistent: [1, 2, 5, 10, 25, 50, 100, 250, 500, 750, 1000, 1250, 1500, 2000, 3000, 4000, 5000]

deployments:
  - name: direct
    kind: direct
    modes: [fresh, persistent]

  - name: baremetal_full_reuse
    kind: baremetal
    trace_enabled: false
    modes: [fresh, persistent]
    command: ["./middlebox", "-log_level", "error", "-reuse_dc=true", "-ca", "/path/to/dcmb/certs_external/ca.crt", "-trace", "buffers"]

  - name: sgx_full_reuse
    kind: gramine_sgx
    trace_enabled: false
    modes: [fresh, persistent]
    rates_by_mode:
      fresh: [1]
      persistent: [1, 2, 5, 10, 25, 50, 100, 250, 500, 750, 1000, 1250, 1500, 2000, 3000, 4000, 5000]
    command: ["gramine-sgx", "middlebox", "-log_level", "error", "-reuse_dc=true", "-trace", "buffers"]
    env:
      MBX_EMIT_QUOTE: "0"

  - name: docker_full_noreuse
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    network: dcmb-middlebox-net
    worker_certs_host_path: /path/to/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    modes: [fresh]
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: false
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: buffers
    docker_api_timeout_ms: 5000

  - name: docker_full_reuse
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    network: dcmb-middlebox-net
    worker_certs_host_path: /path/to/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    modes: [persistent]
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: true
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: buffers
    docker_api_timeout_ms: 5000

  - name: docker_sgxgo_full_noreuse
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    network: dcmb-middlebox-net
    worker_certs_host_path: /path/to/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    modes: [fresh]
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: false
    worker_sgx_enabled: true
    worker_emit_quote: "0"
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: buffers
    docker_api_timeout_ms: 5000

  - name: docker_sgxgo_full_reuse
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    network: dcmb-middlebox-net
    worker_certs_host_path: /path/to/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    modes: [persistent]
    rates: [1, 2, 5, 10, 25, 50, 100, 250, 500, 750, 1000, 1250, 1500, 2000, 3000, 4000, 5000]
    prewarm_for_clients: true
    pool_readiness_timeout_s: 180
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: true
    worker_sgx_enabled: true
    worker_emit_quote: "0"
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: buffers
    docker_api_timeout_ms: 5000

  - name: docker_full_resumption
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    network: dcmb-middlebox-net
    worker_certs_host_path: /path/to/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    modes: [resumption]
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: false
    ticket_identity_key: dcmb-paper-resumption
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: buffers
    docker_api_timeout_ms: 5000

  - name: docker_sgxgo_full_resumption
    kind: docker_gateway
    runtime: docker
    socket_host: /var/run/docker.sock
    socket_container: /var/run/docker.sock
    network: dcmb-middlebox-net
    worker_certs_host_path: /path/to/dcmb/certs_external
    worker_certs_container_path: /home/bonsai/dcmb/certs_external
    worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    modes: [resumption]
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: false
    worker_sgx_enabled: true
    worker_emit_quote: "0"
    ticket_identity_key: dcmb-paper-resumption
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: buffers
    docker_api_timeout_ms: 5000
