campaign:
  name: paper_single_client
  output_root: experiments
  # Final paper: use >=5 runs/point, 10 for noisy p99 points; startup-only uses 20-30.
  runs: 1
  duration_s: 30
  warmup_s: 1
  cooldown_s: 10
  readiness_timeout_s: 30
  cpu_interval_s: 0.2
  trace_buffer_events: 100000
  trace_drop_on_full: true

hosts:
  client:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  middlebox:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  server:
    host: localhost
    ip: 10.79.1.175
    work_dir: /home/bonsai/dcmb

paths:
  middlebox_dir: /home/bonsai/dcmb/DC/Middlebox

server:
  target_url: https://10.79.1.175:8000
  cert_url: http://10.79.1.175:5000
  request_path: /function/init
  certserver_command: ["./certserver", "-log_level", "error"]
  appserver_command: ["./appserver", "-log_level", "error"]

client:
  binary: ./client
  method: POST
  servername: server
  data:
    operation: init
  headers:
    - "Authorization: Bearer token"
    - "Content-Type: application/json"
    - "X-Testing: 1"
  max_in_flight: 1024

client_matrix:
  modes: [fresh, persistent, resumption]
  clients: [1]
  rates_by_mode:
    # Relaxed points are sufficient for the latency distributions. Handshake
    # capacity is explored separately by configs_handshake_capacity.yml.
    fresh: [1]
    resumption: [10]
    # Dense around the low-load baseline, the expected one-client knees, and
    # the previously sparse interval between 1000 and 5000 requests/s.
    persistent: [1, 2, 5, 10, 25, 50, 100, 250, 500, 750, 1000, 1250, 1500, 2000, 3000, 4000, 5000]

deployments:
  - name: direct
    kind: direct
    modes: [fresh, persistent]

  - name: baremetal_full_reuse
    kind: baremetal
    modes: [fresh, persistent]
    command: ["./middlebox", "-log_level", "error", "-reuse_dc=true"]

  - name: sgx_full_reuse
    kind: gramine_sgx
    modes: [fresh, persistent]
    command: ["gramine-sgx", "middlebox", "-log_level", "error", "-reuse_dc=true"]
    env:
      MBX_EMIT_QUOTE: "1"

  - name: docker_full_noreuse
    kind: docker_gateway
    modes: [fresh]
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: false
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000

  - name: docker_full_reuse
    kind: docker_gateway
    modes: [persistent]
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: true
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000

  - name: docker_sgxgo_full_noreuse
    kind: docker_gateway
    modes: [fresh]
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: false
    worker_sgx_enabled: true
    worker_emit_quote: "1"
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000

  - name: docker_sgxgo_full_reuse
    kind: docker_gateway
    modes: [persistent]
    prewarm_for_clients: true
    pool_readiness_timeout_s: 180
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: true
    worker_sgx_enabled: true
    worker_emit_quote: "1"
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000

  - name: docker_full_resumption
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    modes: [resumption]
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: false
    ticket_identity_key: dcmb-paper-resumption
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000

  - name: docker_sgxgo_full_resumption
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    modes: [resumption]
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: false
    worker_sgx_enabled: true
    worker_emit_quote: "1"
    ticket_identity_key: dcmb-paper-resumption
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
