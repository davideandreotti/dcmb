campaign:
  name: huge_comparison_resume
  output_root: experiments
  runs: 1
  duration_s: 30
  warmup_s: 1
  cooldown_s: 2
  readiness_timeout_s: 30
  cpu_interval_s: 0.2
  trace_buffer_events: 100000
  trace_drop_on_full: true

hosts:
  client:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  middlebox:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  server:
    host: localhost
    ip: 10.79.1.175
    work_dir: /home/bonsai/dcmb

paths:
  middlebox_dir: /home/bonsai/dcmb/DC/Middlebox
  server_app_script: /home/bonsai/dcmb/PerformanceMeasuring/certs_server.py

server:
  target_url: https://10.79.1.175:8000
  cert_url: http://10.79.1.175:5000
  request_path: /function/init
  certserver_command: ["./certserver"]
  appserver_command: ["python3", "-u", "/home/bonsai/dcmb/PerformanceMeasuring/certs_server.py"]

client:
  binary: ./client
  method: POST
  servername: server
  data:
    operation: init
  headers:
    - "Authorization: Bearer token"
    - "Content-Type: application/json"
    - "X-Testing: 1"
  max_in_flight: 1024

client_matrix:
  modes: [fresh, persistent]
  clients: [1]
  rates: [1, 5, 10, 50, 100, 500, 1000]

deployments:
  - name: baremetal_full_reuse
    kind: baremetal
    command: ["./middlebox", "-log_level", "debug", "-minimal_logs=false", "-reuse_dc=true"]
    modes: [fresh]
    rates: [1000]

  - name: baremetal_full_noreuse
    kind: baremetal
    command: ["./middlebox", "-log_level", "debug", "-minimal_logs=false", "-reuse_dc=false"]
    modes: [fresh]
    rates: [1000]

  - name: baremetal_empty_reuse
    kind: baremetal
    command: ["./middlebox_emptyhandler", "-log_level", "debug", "-minimal_logs=false", "-reuse_dc=true"]
    modes: [fresh]
    rates: [1000]

  - name: baremetal_empty_noreuse
    kind: baremetal
    command: ["./middlebox_emptyhandler", "-log_level", "debug", "-minimal_logs=false", "-reuse_dc=false"]
    modes: [fresh]
    rates: [1000]

  - name: sgx_empty_noreuse
    kind: gramine_sgx
    command: ["gramine-sgx", "middlebox_emptyhandler", "-log_level", "debug", "-minimal_logs=false", "-reuse_dc=false"]
    modes: [fresh]
    rates: [100, 500, 1000]
    env:
      MBX_EMIT_QUOTE: "1"

  - name: sgx_empty_noreuse
    kind: gramine_sgx
    command: ["gramine-sgx", "middlebox_emptyhandler", "-log_level", "debug", "-minimal_logs=false", "-reuse_dc=false"]
    modes: [persistent]
    rates: [1, 5, 10, 50, 100, 500, 1000]
    env:
      MBX_EMIT_QUOTE: "1"

  - name: sgxgo_full_reuse
    kind: gramine_sgx
    command: ["gramine-sgx", "middlebox_sgxgo", "-log_level", "debug", "-minimal_logs=false", "-reuse_dc=true"]
    modes: [fresh, persistent]
    rates: [1, 5, 10, 50, 100, 500, 1000]
    env:
      MBX_EMIT_QUOTE: "1"

  - name: sgxgo_full_noreuse
    kind: gramine_sgx
    command: ["gramine-sgx", "middlebox_sgxgo", "-log_level", "debug", "-minimal_logs=false", "-reuse_dc=false"]
    modes: [fresh, persistent]
    rates: [1, 5, 10, 50, 100, 500, 1000]
    env:
      MBX_EMIT_QUOTE: "1"

  - name: docker_full_noreuse
    kind: docker_gateway
    modes: [fresh, persistent]
    rates: [1, 5, 10, 50, 100, 500, 1000]
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: false
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000

  - name: docker_empty_noreuse
    kind: docker_gateway
    modes: [fresh, persistent]
    rates: [1, 5, 10, 50, 100, 500, 1000]
    worker_image: dcmiddlebox-worker:emptyhandler
    worker_reuse_dc: false
    min_ready: 10
    scale_up_by: 10
    container_stats_scope: all
    worker_trace_enabled: false
    docker_api_timeout_ms: 5000
