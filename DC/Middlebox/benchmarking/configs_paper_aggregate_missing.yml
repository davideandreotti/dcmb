campaign:
  name: paper_aggregate_missing
  output_root: experiments
  # Final paper: use >=5 runs/point, 10 for noisy p99 points.
  runs: 1
  duration_s: 30
  warmup_s: 1
  cooldown_s: 2
  readiness_timeout_s: 30
  cpu_interval_s: 0.2
  trace_buffer_events: 100000
  trace_drop_on_full: true

hosts:
  client:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  middlebox:
    host: localhost
    ip: 127.0.0.1
    work_dir: /home/bonsai/dcmb/DC/Middlebox
  server:
    host: localhost
    ip: 10.79.1.175
    work_dir: /home/bonsai/dcmb

paths:
  middlebox_dir: /home/bonsai/dcmb/DC/Middlebox

server:
  target_url: https://10.79.1.175:8000
  cert_url: http://10.79.1.175:5000
  request_path: /function/init
  certserver_command: ["./certserver", "-log_level", "error"]
  appserver_command: ["./appserver", "-log_level", "error"]

client:
  binary: ./client
  method: POST
  servername: server
  data:
    operation: init
  headers:
    - "Authorization: Bearer token"
    - "Content-Type: application/json"
    - "X-Testing: 1"

# Explicit points avoid running the full clients x rates Cartesian product.
# Rate 0 measures closed-loop capacity. The existing scalability campaign
# already contains (1 client, 10 rps) and (10 clients, 100 rps), so only the
# two missing 10 requests/s/client points are repeated here.
client_matrix:
  modes: [persistent]
  points:
    - {clients: 1, rate: 0}
    - {clients: 5, rate: 0}
    - {clients: 5, rate: 50}
    - {clients: 10, rate: 0}
    - {clients: 50, rate: 0}
    - {clients: 50, rate: 500}

deployments:
  - name: docker_full_reuse
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 120
    worker_image: dcmiddlebox-worker:baseline
    worker_reuse_dc: true
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false

  - name: docker_sgxgo_full_reuse
    kind: docker_gateway
    prewarm_for_clients: true
    pool_readiness_timeout_s: 180
    worker_image: dcmiddlebox-worker:sgxgo
    worker_reuse_dc: true
    worker_sgx_enabled: true
    worker_emit_quote: "1"
    scale_up_by: 10
    container_stats_scope: all
    container_stats_collector: auto
    worker_trace_enabled: false
