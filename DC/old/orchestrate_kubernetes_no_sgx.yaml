apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-kubernetes
  labels:
    app: server-kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server-kubernetes
  template:
    metadata:
      labels:
        app: server-kubernetes
    spec:
      containers:
        - name: server
          image: server:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "certs_server.py"]
          ports:
            - containerPort: 5000
              name: certs
              protocol: TCP
            - containerPort: 8000
              name: app-tls
              protocol: TCP
          volumeMounts:
            - name: server-certs
              mountPath: /certs
          startupProbe:
            tcpSocket:
              port: 8000
            failureThreshold: 120
            periodSeconds: 1
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 6
      volumes:
        - name: server-certs
          hostPath:
            path: /home/bonsai/Desktop/MasterThesis/certs_external/server
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector:
    app: server-kubernetes
  ports:
    - name: certs
      protocol: TCP
      port: 5000
      targetPort: 5000
    - name: app-tls
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: middlebox-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: middlebox-gateway
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: middlebox-gateway
subjects:
  - kind: ServiceAccount
    name: middlebox-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: middlebox-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: middlebox-operator-kubernetes
  labels:
    app: middlebox-operator-kubernetes
spec:
  replicas: 15
  selector:
    matchLabels:
      app: middlebox-operator-kubernetes
  template:
    metadata:
      labels:
        app: middlebox-operator-kubernetes
    spec:
      containers:
        - name: middlebox-operator
          image: mb_operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
              name: https-mb
              protocol: TCP
          volumeMounts:
            - name: certs-dir
              mountPath: /certs
          startupProbe:
            tcpSocket:
              port: 8443
            failureThreshold: 240
            periodSeconds: 1
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 6
      volumes:
        - name: certs-dir
          hostPath:
            path: /home/bonsai/Desktop/MasterThesis/DC/certs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: middlebox-operator-kubernetes
spec:
  selector:
    app: middlebox-operator-kubernetes
  ports:
    - name: https
      protocol: TCP
      port: 8443
      targetPort: 8443
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: middlebox-gateway-kubernetes
  labels:
    app: middlebox-gateway-kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: middlebox-gateway-kubernetes
  template:
    metadata:
      labels:
        app: middlebox-gateway-kubernetes
    spec:
      serviceAccountName: middlebox-gateway
      containers:
        - name: gateway
          image: mb_gateway:latest
          imagePullPolicy: IfNotPresent
          command: ["./gateway"]
          ports:
            - containerPort: 9443
              name: https-gw
              protocol: TCP
            - containerPort: 8088
              name: health
              protocol: TCP
          env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBERNETES_BACKEND_LABEL_SELECTOR
              value: app=middlebox-operator-kubernetes
            - name: KUBERNETES_DELETE_AFTER_USE
              value: "true"
            - name: OPERATOR_SELECTION_POLICY
              value: first
            - name: NO_READY_OPERATOR_POLICY
              value: wait
            - name: NO_READY_OPERATOR_WAIT_SECONDS
              value: "1"
            - name: NO_READY_OPERATOR_RETRY_MS
              value: "25"
            - name: KUBERNETES_API_TIMEOUT_MS
              value: "150"
          startupProbe:
            tcpSocket:
              port: 9443
            failureThreshold: 120
            periodSeconds: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: middlebox-kubernetes
spec:
  selector:
    app: middlebox-gateway-kubernetes
  ports:
    - name: https
      protocol: TCP
      port: 8443
      targetPort: 9443
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-kubernetes
  labels:
    app: client-kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-kubernetes
  template:
    metadata:
      labels:
        app: client-kubernetes
    spec:
      containers:
        - name: client
          image: client:latest
          imagePullPolicy: IfNotPresent
          command: ["tail", "-f", "/dev/null"]
