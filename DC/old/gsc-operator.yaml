# Configurazione GSC per l'immagine operator middlebox SGX.
# Usata da: gsc build mb_operator_base operator_gsc.manifest -c gsc-operator.yaml
#           gsc sign-image mb_operator_base enclave-key.pem -c gsc-operator.yaml

# Distribuzione base: deve corrispondere alla distro in Dockerfile.operator_base_gsc
Distro: "ubuntu:22.04"

Registry: ""

# Usa l'immagine Gramine prebuilt per evitare la compilazione da sorgente (> 30 minuti).
# gramineproject/gramine:latest contiene gramine 1.x stabile per ubuntu 22.04.
Gramine:
    Image: "gramineproject/gramine:latest"
