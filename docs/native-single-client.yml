# Native-only handover template; copy to an ignored local config before use.
# Replace /path/to/dcmb and SERVER_IP as documented in native-experiment-handover.md.
# Derived from the final October buffer-mode campaign; retain all workload settings.
campaign:
  name: paper_single_client
  output_root: experiments
  runs: 5
  duration_s: 60
  warmup_s: 1
  cooldown_s: 10
  readiness_timeout_s: 30
  cpu_interval_s: 0.2
  trace_roles:
  - client
  - gateway
  - certserver
  - server
  trace_buffer_events: 100000
  trace_drop_on_full: true
hosts:
  client:
    host: localhost
    ip: 127.0.0.1
    work_dir: /path/to/dcmb/DC/Middlebox
  middlebox:
    host: localhost
    ip: 127.0.0.1
    work_dir: /path/to/dcmb/DC/Middlebox
  server:
    host: localhost
    ip: SERVER_IP
    work_dir: /path/to/dcmb/DC/Middlebox
paths:
  middlebox_dir: /path/to/dcmb/DC/Middlebox
server:
  target_url: https://SERVER_IP:8000
  cert_url: http://SERVER_IP:5000
  request_path: /function/init
  certserver_command:
  - ./certserver
  - -log_level
  - error
  - -cert-path
  - /path/to/dcmb/certs_external/server/cert.pem
  - -key-path
  - /path/to/dcmb/certs_external/server/key.pem
  appserver_command:
  - ./appserver
  - -log_level
  - error
  - -cert-path
  - /path/to/dcmb/certs_external/server/cert.pem
  - -key-path
  - /path/to/dcmb/certs_external/server/key.pem
client:
  binary: ./client
  method: POST
  servername: server
  data:
    operation: init
  headers:
  - 'Authorization: Bearer token'
  - 'Content-Type: application/json'
  - 'X-Testing: 1'
  max_in_flight: 1024
  pacing: spin
client_matrix:
  modes:
  - persistent
  clients:
  - 1
  rates_by_mode:
    persistent:
    - 1
    - 2
    - 5
    - 10
    - 25
    - 50
    - 100
    - 250
    - 500
    - 750
    - 1000
    - 1250
    - 1500
    - 2000
    - 3000
    - 4000
    - 5000
deployments:
- name: baremetal_full_reuse
  kind: baremetal
  modes:
  - persistent
  command:
  - ./middlebox
  - -log_level
  - error
  - -reuse_dc=true
  - -ca
  - /path/to/dcmb/certs_external/ca.crt
  - -trace
  - buffers
  trace_enabled: false
- name: docker_full_reuse
  kind: docker_gateway
  runtime: docker
  socket_host: /var/run/docker.sock
  socket_container: /var/run/docker.sock
  network: dcmb-middlebox-net
  worker_certs_host_path: /path/to/dcmb/certs_external
  worker_certs_container_path: /home/bonsai/dcmb/certs_external
  worker_ca: /home/bonsai/dcmb/certs_external/ca.crt
  modes:
  - persistent
  prewarm_for_clients: true
  pool_readiness_timeout_s: 120
  worker_image: dcmiddlebox-worker:baseline
  worker_reuse_dc: true
  min_ready: 10
  scale_up_by: 10
  container_stats_scope: all
  container_stats_collector: auto
  worker_trace_enabled: buffers
  docker_api_timeout_ms: 5000
